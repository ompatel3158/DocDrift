[project]
name = "docdrift"
version = "0.1.0"
description = "AI + deterministic code verifier that catches outdated README and documentation claims and fixes them"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
docdrift = "docdrift.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
